services:
  api:
    # Build from local backend, or pull your published image:
    # image: mahmoudznabil/ms-rooms:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mahmoudznabil/ms-rooms:latest
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
